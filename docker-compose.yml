services:
  # ============================================================
  # Database — PostgreSQL
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: text-match-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: my_password
      POSTGRES_DB: text_match_analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d text_match_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  # ============================================================
  # Backend — Express.js API
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: text-match-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://db_user:my_password@postgres:5432/text_match_analyzer
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      # DB_SYNC=true agar TypeORM membuat tabel secara otomatis saat pertama kali dijalankan.
      # Aman dipertahankan karena TypeORM hanya membuat tabel yang belum ada (tidak menghapus data).
      DB_SYNC: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  # ============================================================
  # Frontend — React + Nginx
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Saat build di Docker, frontend memanggil backend via port yang di-expose ke host
        VITE_API_URL: http://localhost:3000/api
    container_name: text-match-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
